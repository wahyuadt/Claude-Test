<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found</title>
  <meta name="description" content="This page could not be found.">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <!-- This page is shown for ANY missing URL, at any depth (e.g. /Claude-Test/no/such/page),
       so it loads nothing by relative path: styles and icon are inline, and the
       "Back to home" link is worked out by the script at the bottom. -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b6b62'/%3E%3Ccircle cx='32' cy='32' r='11' fill='%23fff'/%3E%3C/svg%3E">
  <!-- Styles are inline so this page needs no other files. -->
  <style>
    :root { --bg: #faf8f4; --text: #1d1b18; --muted: #57524b; --accent: #0b6b62; --on-accent: #fff; --focus: #b4410e; color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #131312; --text: #f1ede6; --muted: #b8b0a5; --accent: #5fcfc0; --on-accent: #0d1716; --focus: #ffb070; color-scheme: dark; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.25rem;
      background: var(--bg); color: var(--text); text-align: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; line-height: 1.6;
    }
    .code { margin: 0; font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 700; letter-spacing: 0.1em; color: var(--accent); }
    h1 { margin: 0.5rem 0 1rem; font-family: "Iowan Old Style", Palatino, Georgia, serif; font-size: clamp(2rem, 7vw, 3rem); line-height: 1.15; }
    p { color: var(--muted); max-width: 30rem; margin: 0 auto 2rem; }
    a { display: inline-flex; align-items: center; min-height: 3rem; padding: 0 1.4rem; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>Sorry, the page you're looking for doesn't exist or has moved.</p>
    <!-- The href below is only used when JavaScript is off. It must match your
         repository name EXACTLY, including capital letters (GitHub Pages paths
         are case-sensitive). With JavaScript on, the script below finds the
         home page by itself, so renaming the repository won't break it. -->
    <a id="home-link" href="/Claude-Test/">Back to home</a>
  </main>
  <script>
    // Find the site's home page from the current address.
    // GitHub Pages only shows this page under the site's own folder, so the
    // first part of the path (e.g. "/Claude-Test/", with the exact capitals the
    // visitor used) is the home page. A quick HEAD request confirms it; if the
    // server says it doesn't exist, we fall back to the fixed link written
    // above. We never switch to "/" on our own.
    (function () {
      var link = document.getElementById("home-link");
      var fallback = link.getAttribute("href");
      var first = location.pathname.split("/")[1];
      if (!first) return;
      var guess = "/" + first + "/";
      link.href = guess;
      if (guess === fallback || !window.fetch) return;
      fetch(guess, { method: "HEAD" })
        .then(function (res) { if (!res.ok) link.href = fallback; })
        .catch(function () { /* network error: keep the guess */ });
    })();
  </script>
</body>
</html>
